<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <!--tr stands for Table Row-->
          <tr>
            <!--th stands for table heading-->
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <!--td stands for table data-->
            <td>Lawrence E. Corbridge</td>
            <td>Stand Forever</td>
            <td>Utah</td>
            <td>2019</td>
          </tr>
          <tr>
            <td>Kriss Pond</td>
            <td>Our Covenant Connection to Jesus Christ</td>
            <td>BYU-Idaho I-Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle Is the Lord’s</td>
            <td>BYU-Idaho I-Center</td>
            <td>2026</td>
          </tr>
        </table>

        <form>
          <label for="speaker-name">Speaker: </label>
          <input type="text" id="speaker-name" required>

          <label for="title">Title: </label>
          <input type="text" id="title">

          <label for="location">Location: </label>
          <input type="text" id="location">

          <label for="year">Year: </label>
          <input type="text" id="year">
          <input type="submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
